name: Build and publish frontend image

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/frontend-ecr.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-ecr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push commit image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/officerpro/frontend:${{ github.sha }}
          cache-from: type=gha,scope=officerpro-frontend
          cache-to: type=gha,mode=max,scope=officerpro-frontend

      - name: Tag main image as latest
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_SHA: ${{ steps.ecr-login.outputs.registry }}/officerpro/frontend:${{ github.sha }}
          IMAGE_LATEST: ${{ steps.ecr-login.outputs.registry }}/officerpro/frontend:latest
        run: |
          docker pull "$IMAGE_SHA"
          docker tag "$IMAGE_SHA" "$IMAGE_LATEST"
          docker push "$IMAGE_LATEST"

      - name: Deploy frontend to EC2 through Systems Manager
        if: github.ref == 'refs/heads/main'
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          FRONTEND_EC2_INSTANCE_ID: ${{ vars.FRONTEND_EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/officerpro/frontend:${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$FRONTEND_EC2_INSTANCE_ID" ]]; then
            echo "Set the FRONTEND_EC2_INSTANCE_ID repository variable to the Terraform output." >&2
            exit 1
          fi

          script_b64="$(base64 -w0 scripts/deploy-frontend-on-instance.sh)"
          parameters_file="$RUNNER_TEMP/frontend-ssm-parameters.json"
          jq -n \
            --arg script "$script_b64" \
            --arg image "$IMAGE_URI" \
            --arg region "$AWS_REGION" \
            '{commands: [
              ("echo " + $script + " | base64 --decode > /tmp/deploy-officerspro-frontend.sh"),
              "chmod 700 /tmp/deploy-officerspro-frontend.sh",
              ("IMAGE_URI=" + $image + " AWS_REGION=" + $region + " /tmp/deploy-officerspro-frontend.sh")
            ]}' > "$parameters_file"

          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$FRONTEND_EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy frontend ${GITHUB_SHA}" \
            --parameters "file://${parameters_file}" \
            --query 'Command.CommandId' \
            --output text)"

          command_status=""
          for attempt in $(seq 1 90); do
            command_status="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$FRONTEND_EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$command_status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated|DeliveryTimedOut|ExecutionTimedOut)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$FRONTEND_EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac
            sleep 10
          done
          if [[ "$command_status" != "Success" ]]; then
            echo "Timed out waiting for the frontend SSM deployment command." >&2
            exit 1
          fi

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$FRONTEND_EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
