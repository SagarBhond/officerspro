name: Build and deploy OfficersPro

on:
  push:
    branches: [main]
    paths:
      - "officerspro/Officers-pro-backend/**"
      - "officerspro/infra/terraform/**"
      - "officerspro/infra/database/**"
      - "officerspro/infra/keycloak/**"
      - "officerspro/Officerspro-Microservices-Infrastructure/**"
      - "officerspro/scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: officerspro-production
  cancel-in-progress: false

jobs:
  test-complaint-fir:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: complaintFIR
          MYSQL_USER: complaint_fir_test
          MYSQL_PASSWORD: complaint_fir_test_password
          MYSQL_ROOT_PASSWORD: complaint_fir_test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out complaint/FIR service
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test complaint and FIR service
        working-directory: officerspro/Officers-pro-backend/complaint-fir-service
        env:
          SPRING_CONFIG_IMPORT: optional:configserver:http://localhost:8888
          SPRING_CLOUD_CONFIG_FAIL_FAST: "false"
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/complaintFIR?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: complaint_fir_test
          SPRING_DATASOURCE_PASSWORD: complaint_fir_test_password
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
          EUREKA_CLIENT_FETCH_REGISTRY: "false"
        run: mvn --batch-mode --no-transfer-progress test

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test-complaint-fir
    steps:
      - name: Check out application and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN || github.token }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test backend
        working-directory: officerspro/Officers-pro-backend/officers-pro/officers-pro-backend
        run: mvn --batch-mode --no-transfer-progress test

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Build and publish all backend images in AWS CodeBuild
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          DEPLOY_AWS: "yes"
          IMAGE_TAG: ${{ github.sha }}
          TF_VAR_s3_bucket_name: ${{ vars.S3_BUCKET_NAME }}
        run: bash officerspro/scripts/publish-ecr-remote.sh

      - name: Deploy backend to ECS
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'officerspro' }}
        run: |
          set -euo pipefail
          services=(
            officerspro-backend
            officerspro-keycloak
            officerspro-complaint-fir
            officerspro-admin-backend
            officerspro-audit-service
            officerspro-chargesheet-generator-service
            officerspro-court-case-management-service
            officerspro-dashboard-service
            officerspro-document-management-service
            officerspro-help-support-feedback-service
            officerspro-investigation-service
            officerspro-profile-service
            officerspro-subscription-payment-service
          )
          for service in "${services[@]}"; do
            service_status="$(aws ecs describe-services \
              --region "$AWS_REGION" \
              --cluster "$ECS_CLUSTER" \
              --services "$service" \
              --query 'services[0].status' \
              --output text)"
            if [[ "$service_status" == "ACTIVE" ]]; then
              aws ecs update-service \
                --region "$AWS_REGION" \
                --cluster "$ECS_CLUSTER" \
                --service "$service" \
                --desired-count 1 \
                --force-new-deployment
            else
              echo "$service is not provisioned yet; apply Terraform to create it."
            fi
          done
