services:
  officerspro-config-service:
    image: officer-pro/officerspro-config-service:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ../officerspro-config-server-git_repo:/config-repo:ro
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: "8888"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://host.docker.internal:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://host.docker.internal:8761/eureka/"
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: file:/config-repo
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: main



