spring:
  application:
    name: audit-service
  datasource:
    url: "jdbc:mysql://localhost:3306/auditDB?createDatabaseIfNotExist=true"
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: NON_NULL

server:
  port: 8089

logging:
  level:
    com:
      configserver:
        officerspro: DEBUG
        officerspro:
          auditservice:
            client: DEBUG
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

feign:
  client:
    config:
      default:
        loggerLevel: FULL

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true