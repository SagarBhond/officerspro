spring:
  application:
    name: help-service

  datasource:
    url: jdbc:mysql://localhost:3306/helpandsupportfeedback?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8094

logging:
  level:
    com.configserver.officerspro.helpsupportfeedbackservice: DEBUG
    org.springframework.web: INFO
    org.springframework.web.client.RestTemplate: DEBUG
    feign: DEBUG

# Service URLs
audit:
  service:
    url: http://localhost:8086

profile:
  service:
    url: http://localhost:8084/api/profile

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: full

# CORS Configuration
cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:3000

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
