spring:
  application:
    name: profile-service

  datasource:
    url: jdbc:mysql://localhost:3306/officersproprofile?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8084
  # context-path removed - using controller-level path mapping instead
  # servlet:
  #   context-path: /api/profile

aes:
  encryption:
    key: MySecretKey12345

logging:
  level:
    com.configserverllp.officerspro.profileservice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 🔗 Auth Service Integration
auth:
  service:
    base-url: http://localhost:8088/api/auth

# 🔐 Keycloak Admin Configuration (for Feign interceptor & token fetch)
keycloak:
  auth-server-url: http://localhost:8080/
  realm: OfficerPro
  resource: officerpro-admin
  admin:
    username: admin
    password: admin
    client-secret: 7uW0Fiq7pvLIxlmOEhbRqnBru9dWJ1jQ

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true