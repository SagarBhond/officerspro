# =========================
# Service Info
# =========================
spring:
  application:
    name: court-case-management-service

  datasource:
    url: jdbc:mysql://localhost:3306/officersprocourt
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    database-platform: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  cloud:
    discovery:
      enabled: false

server:
  port: 8092

# =========================
# Eureka Client
# =========================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    enabled: false

# =========================
# Logging Configuration
# =========================
logging:
  level:
    com.netflix.eureka: ERROR
    org.springframework.cloud.netflix.eureka: ERROR
    com.configserver.officerspro.courtcasemanagementservice: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# =========================
# Management / Actuator
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# =========================
# External Services
# =========================
external:
  chargesheet:
    base-url: http://localhost:8095
  document:
    base-url: http://localhost:8085/api/documents