services:
  profile-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://host.docker.internal:8888"
      SPRING_CLOUD_CONFIG_FAIL_FAST: "false"
      AES_ENCRYPTION_KEY: "OfficersProDevKey2026-LocalOnly!"
      AUTH_SERVICE_BASE_URL: "http://host.docker.internal:8088/api/auth"
      KEYCLOAK_AUTH_SERVER_URL: "http://host.docker.internal:8080/"
      KEYCLOAK_REALM: OfficerPro
      KEYCLOAK_RESOURCE: officerpro-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: "${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET}"
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/officerspro?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: officerspro
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: officerspro
      MYSQL_USER: officerspro
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    ports:
      - "3387:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql-data:


