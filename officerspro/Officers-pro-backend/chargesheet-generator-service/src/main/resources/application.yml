server:
  port: 8095

spring:
  application:
    name: chargesheet-service

  datasource:
    url: "jdbc:mysql://localhost:3306/chargesheetdb?createDatabaseIfNotExist=true"
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
   # optional, actuator on different port (or remove if same as main app)

# External service URLs
external:
  courtcase:
    base-url: http://localhost:8092/courtcases
