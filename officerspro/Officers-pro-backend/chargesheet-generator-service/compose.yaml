services:
  chargesheet-generator-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    environment:
      SERVER_PORT: "8095"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://host.docker.internal:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://host.docker.internal:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/officerspro?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: officerspro
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: officerspro
      MYSQL_USER: officerspro
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    ports:
      - "3391:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql-data:


