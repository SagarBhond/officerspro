spring.application.name=officers-pro-backend

# Database credentials are injected by the runtime (Secrets Manager in ECS).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:officerspro}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:officerspro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:localroot}

# Max file size
spring.servlet.multipart.max-file-size=4096MB
# Max request size (including multipart/form-data)
spring.servlet.multipart.max-request-size=4096MB
spring.servlet.multipart.enabled=true

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

aes.encryption.key=${AES_ENCRYPTION_KEY}
server.port=${SERVER_PORT:8082}

logging.level.org.springframework=INFO
logging.level.org.keycloak=INFO
logging.level.org.springframework.security=INFO

# Keycloak
keycloak.use-resource-role-mappings=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwt-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
keycloak.config.frontend-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID:officerspro-frontend}
keycloak.config.backend-client-id=${KEYCLOAK_BACKEND_CLIENT_ID:officerspro-backend}
keycloak.config.principal-attribute=preferred_username
keycloak.config.server-url=${KEYCLOAK_SERVER_URL}
keycloak.config.realm=${KEYCLOAK_REALM:officers-pro}
keycloak.config.client-secret=${KEYCLOAK_CLIENT_SECRET}

# Mail credentials are injected by the runtime.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.socketFactory.port=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SOCKETFACTORY_PORT:587}
spring.mail.properties.mail.smtp.socketFactory.class=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SOCKETFACTORY_CLASS:javax.net.ssl.SSLSocketFactory}

email.subject=${EMAIL_SUBJECT:}
email.htmlContent=${EMAIL_HTML_CONTENT:}

# S3 uses the ECS task role (or the local AWS credential provider chain).
cloud.aws.region.static=${AWS_REGION:ap-south-1}
cloud.aws.s3.bucket.name=${AWS_S3_BUCKET}
