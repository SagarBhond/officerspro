name: CI/CD Pipeline on EC2

on:
  push:
    branches:
      - main 

jobs:
  run-on-ec2:
    name: Run Pipeline on EC2 Instance
    runs-on: self-hosted # Use the self-hosted runner on your EC2 instance

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # - name: Log in to Docker Hub
    #   run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
    
    - name: check the path 
      run: pwd

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/officers-pro-backend:latest . -f officers-pro-backend/dockerfile
        docker build -t ${{ secrets.DOCKER_USERNAME }}/officers-pro-front-end:latest . -f officers-pro-front-end/dockerfile

    # - name: Push Docker Image to Docker Hub
    #   run: |
    #     docker push ${{ secrets.DOCKER_USERNAME }}/officers-pro-front-end:latest

    - name: Deploy Docker Container
      run: |
        # Stop and remove any existing container
        docker stop officers-pro-backend || true
        docker stop officers-pro-front-end || true
        docker rm -f officers-pro-backend || true
        docker rm -f officers-pro-front-end || true

        # Pull the latest image
        # docker pull ${{ secrets.DOCKER_USERNAME }}/your-app:latest

        # Run the container
        docker run -it -d --name officers-pro-backend -p 8082:8082 ${{ secrets.DOCKER_USERNAME }}/officers-pro-backend:latest
        docker run -it -d --name officers-pro-front-end -p 5173:5173 ${{ secrets.DOCKER_USERNAME }}/officers-pro-front-end:latest
    
    - name: docker network
      run: |
        docker network create officerspro 
        docker network connect officerspro officers-pro-backend
        docker network connect officerspro officers-pro-front-end