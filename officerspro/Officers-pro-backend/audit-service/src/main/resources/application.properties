spring.application.name=audit-service
server.port=8086

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/auditDB?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging Configuration
logging.level.com.configserver.officerspro=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# Feign Client Logging
logging.level.com.configserver.officerspro.auditservice.client=DEBUG
feign.client.config.default.loggerLevel=FULL
