spring:
  application:
    name: complaintandfir-service1

  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1
    compatibility-verifier:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/OfficerPro}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/OfficerPro/protocol/openid-connect/certs}

auth:
  service:
    base-url: http://localhost:8088/api/auth